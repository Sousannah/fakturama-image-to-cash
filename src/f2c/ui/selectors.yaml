# ===== invoice editor ======================================================
invoice.no_field:                        # spec 5.1 - read only
  - {tier: anchor, anchor_text: "No.", direction: right, type: Edit, scope: invoice_editor, anchor_exact: true, enabled_only: false}

invoice.custref_field:
  - {tier: uia, type: Edit, name: "Cust.Ref.", scope: invoice_editor}
  - {tier: anchor, anchor_text: "Cust.Ref.", direction: right, type: Edit, scope: invoice_editor}

# The Invoice's payment row reads:
#     [x] paid   [Bank Transfer v]   at [ 19 Sep 2026 ]   Value [ 678.30 ]
# and only the checkbox and the Value box carry names - the method combo and
# the date are unnamed, so both are found from the labels beside them. The date
# and Value fields do not exist at all until "paid" is ticked, which is why
# they could not be calibrated until a run first got this far.
invoice.payment_combo:                   # spec 5.2
  - {tier: uia, type: ComboBox, name_contains: "Payment", scope: invoice_editor}
  - {tier: anchor, anchor_text: "paid", direction: right, type: ComboBox, scope: invoice_editor, anchor_exact: true}
  - {tier: uia, type: ComboBox, scope: invoice_editor, pick: leftmost}

invoice.paid_check:                      # spec 5.3
  - {tier: uia, type: CheckBox, name: "paid", scope: invoice_editor}
  - {tier: uia, type: CheckBox, name_contains: "paid", scope: invoice_editor}
  - {tier: anchor, anchor_text: "paid", direction: left, type: CheckBox, scope: invoice_editor}

invoice.payment_date:                    # spec 5.3 - the box after "at"
  - {tier: uia, type: Edit, name_contains: "Payment date", scope: invoice_editor}
  - {tier: anchor, anchor_text: "at", direction: right, type: Edit, scope: invoice_editor, anchor_exact: true}

invoice.paid_value:                      # spec 5.3
  - {tier: uia, type: Edit, name: "Value", scope: invoice_editor}
  - {tier: anchor, anchor_text: "Value", direction: right, type: Edit, scope: invoice_editor}

invoice.total_gross_label:               # read-only: see order.total_net_label
  - {tier: uia, type: Edit, name: "Total", scope: invoice_editor, enabled_only: false}
  - {tier: anchor, anchor_text: "Total", direction: right, type: Edit, scope: invoice_editor, anchor_exact: true, enabled_only: false}
